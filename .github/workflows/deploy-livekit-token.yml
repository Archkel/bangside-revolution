name: Deploy LiveKit Token Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure LiveKit secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          test -n "$LIVEKIT_URL" && test -n "$LIVEKIT_API_KEY" && test -n "$LIVEKIT_API_SECRET"
          supabase secrets set --project-ref gudgvtlokieughgsjyju \
            LIVEKIT_URL="$LIVEKIT_URL" \
            LIVEKIT_API_KEY="$LIVEKIT_API_KEY" \
            LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET"

      - name: Deploy livekit-token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy livekit-token --project-ref gudgvtlokieughgsjyju
